
name: Terraform Destroy

on:
  workflow_dispatch:
     inputs:
       confirm_destroy:
         description: 'Type DESTROY to confirm infrastructure deletion'
         required: true
         type: string

permissions:
  id-token: write
  contents: read

jobs:
  destroy:
    name: Terraform Destroy
    runs-on: ubuntu-latest
    environment: terraform-destroy

    defaults:
      run:
        working-directory: infra

    env:
      TF_IN_AUTOMATION: "true"
      TF_VAR_aws_region: ${{ vars.AWS_REGION }}
      TF_VAR_acm_certificate_arn: ${{ vars.ACM_CERTIFICATE_ARN }}
      TF_VAR_container_image: ${{ vars.CONTAINER_IMAGE }}
      TF_VAR_domain_name: ${{ vars.DOMAIN_NAME }}
      TF_VAR_app_environment: ${{ vars.APP_ENVIRONMENT }}
      TF_VAR_project_name: ${{ vars.PROJECT_NAME }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::345471468677:role/github-actions-terraform-deploy
          aws-region: eu-north-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Destroy Plan
        run: terraform plan -destroy -input=false -out=destroy.tfplan

      - name: Terraform Destroy
        if: ${{ github.event.inputs.confirm_destroy == 'DESTROY' }}
        run: terraform apply -input=false -auto-approve destroy.tfplan
